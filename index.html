<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Peraturan Perusahaan - Medika Group</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
      100% { transform: translateY(0px) scale(1); }
    }
    .animate-float-slow { animation: float 6s ease-in-out infinite; }
    .animate-float-fast { animation: float 4s ease-in-out infinite reverse; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 text-slate-800 min-h-screen flex flex-col relative overflow-x-hidden" x-data="appData()" x-init="initApp()">

  <!-- ELEMEN ANIMASI LATAR BELAKANG -->
  <div class="absolute top-10 left-10 w-72 h-72 bg-emerald-500/20 rounded-full blur-3xl animate-float-slow pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl animate-float-fast pointer-events-none"></div>

  <!-- 1. HALAMAN LOGIN -->
  <template x-if="!isLoggedIn">
    <div class="flex-grow flex items-center justify-center px-4 py-12 relative z-10">
      <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-white/20 p-8 space-y-6">
        <div class="text-center space-y-2">
          <div class="inline-flex w-16 h-16 rounded-2xl overflow-hidden bg-slate-50 border border-slate-200 items-center justify-center p-1 mx-auto shadow-inner">
            <img :src="loginLogo" alt="Portal Logo" class="w-full h-full object-contain">
          </div>
          <h1 class="text-2xl font-bold text-slate-900">Portal Peraturan Perusahaan</h1>
          <p class="text-sm text-slate-500">Silakan login sesuai unit kerja dan NIK Anda</p>
        </div>

        <form @submit.prevent="handleLogin()" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Unit Perusahaan</label>
            <select x-model="loginForm.branch" required class="w-full p-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500">
              <option value="PT_MKK">PT Medika Kesehatan Kerja (PT MKK)</option>
              <option value="CV_MGM">CV Medika Group Mandiri (CV MGM)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
            <input type="text" x-model="loginForm.name" placeholder="Masukkan nama lengkap" required class="w-full p-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor Induk Karyawan (NIK)</label>
            <input type="text" x-model="loginForm.nik" placeholder="Contoh: MKK-001 / MGM-001" required class="w-full p-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jabatan / Bagian</label>
            <input type="text" x-model="loginForm.position" placeholder="Contoh: Staff HR / Perawat" required class="w-full p-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500">
          </div>

          <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
            <span>Masuk sebagai Karyawan</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <div class="text-center pt-3 border-t border-slate-100">
          <button @click="promptAdminLogin()" class="text-xs text-slate-500 hover:text-emerald-600 font-medium underline flex items-center justify-center gap-1 mx-auto">
            <i data-lucide="lock" class="w-3 h-3"></i> Login khusus Administrator HR
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- 2. APLIKASI UTAMA -->
  <template x-if="isLoggedIn">
    <div class="flex-grow flex flex-col min-h-screen relative z-10">
      
      <!-- HEADER DINAMIS -->
      <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b shadow-sm" :class="currentUser.role === 'admin' ? 'border-slate-200' : (currentUser.branch === 'PT_MKK' ? 'border-blue-200' : 'border-rose-200')">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex items-center justify-between h-16">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl overflow-hidden bg-white border flex items-center justify-center p-1 shadow-sm"
                   :class="currentUser.branch === 'PT_MKK' ? 'border-blue-300' : 'border-rose-300'">
                <template x-if="currentUser.role === 'admin'">
                  <i data-lucide="shield-check" class="w-6 h-6 text-emerald-600"></i>
                </template>
                <template x-if="currentUser.role !== 'admin' && currentUser.branch === 'PT_MKK'">
                  <img :src="branches.PT_MKK.logo" alt="Logo PT MKK" class="w-full h-full object-contain">
                </template>
                <template x-if="currentUser.role !== 'admin' && currentUser.branch === 'CV_MGM'">
                  <img :src="branches.CV_MGM.logo" alt="Logo CV MGM" class="w-full h-full object-contain">
                </template>
              </div>
              <div>
                <h1 class="text-sm sm:text-base font-bold text-slate-900 leading-tight" x-text="currentUser.role === 'admin' ? 'Admin Panel & Manajemen Peraturan HR' : activeBranchData.name"></h1>
                <p class="text-xs font-semibold" :class="currentUser.role === 'admin' ? 'text-emerald-600' : (currentUser.branch === 'PT_MKK' ? 'text-blue-600' : 'text-rose-600')" 
                   x-text="currentUser.role === 'admin' ? 'Administrator Terverifikasi' : 'Login: ' + currentUser.name + ' (' + currentUser.nik + ') - ' + currentUser.position"></p>
              </div>
            </div>

            <div class="flex items-center space-x-3">
              <!-- TOMBOL NOTIFIKASI KARYAWAN -->
              <template x-if="currentUser.role !== 'admin'">
                <div class="relative">
                  <button @click="showNotifDrawer = !showNotifDrawer; markNotificationsRead()" class="relative p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span x-show="unreadNotificationsCount > 0" x-text="unreadNotificationsCount" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center animate-bounce"></span>
                  </button>

                  <!-- DROPDOWN NOTIFIKASI -->
                  <div x-show="showNotifDrawer" @click.away="showNotifDrawer = false" class="absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-xl shadow-2xl border border-slate-200 p-4 z-50 space-y-3">
                    <div class="flex items-center justify-between border-b pb-2">
                      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-700">Notifikasi Pembaruan Peraturan</h3>
                      <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-semibold" x-text="branchNotifications.length + ' Update'"></span>
                    </div>
                    <div class="max-h-72 overflow-y-auto space-y-2.5">
                      <template x-for="notif in branchNotifications" :key="notif.id">
                        <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 text-xs space-y-1">
                          <div class="flex items-center justify-between">
                            <span class="font-bold text-emerald-700" x-text="notif.title"></span>
                            <span class="text-[10px] text-slate-400" x-text="notif.date"></span>
                          </div>
                          <p class="text-slate-600 leading-relaxed" x-text="notif.message"></p>
                        </div>
                      </template>
                      <div x-show="branchNotifications.length === 0" class="text-center py-4 text-xs text-slate-400">
                        Belum ada pembaruan peraturan terbaru.
                      </div>
                    </div>
                  </div>
                </div>
              </template>

              <button @click="logout()" class="flex items-center gap-1.5 text-xs bg-slate-100 text-slate-700 hover:bg-slate-200 font-semibold px-3 py-2 rounded-lg transition">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Keluar</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

          <!-- SIDEBAR -->
          <aside class="lg:col-span-1 space-y-4">
            <div x-show="currentUser.role !== 'admin'" class="bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-slate-200">
              <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 block">Cari Bab / Pasal / Kata Kunci</label>
              <div class="relative">
                <input type="text" x-model="searchQuery" @input="selectedBab = null" placeholder="Cari cuti, lembur, sanksi, duka..." class="w-full pl-9 pr-8 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2"
                       :class="currentUser.branch === 'PT_MKK' ? 'focus:ring-blue-500' : 'focus:ring-rose-500'">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                <button x-show="searchQuery" @click="searchQuery = ''" class="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              <p x-show="searchQuery" class="text-[11px] text-emerald-700 font-medium mt-2" x-text="'Ditemukan ' + filteredRules.length + ' Bab yang cocok.'"></p>
            </div>

            <div x-show="currentUser.role !== 'admin'" class="border p-4 rounded-xl text-xs space-y-2 shadow-sm backdrop-blur-sm"
                 :class="currentUser.branch === 'PT_MKK' ? 'bg-blue-50/95 border-blue-200 text-blue-900' : 'bg-rose-50/95 border-rose-200 text-rose-900'">
              <div class="font-bold flex items-center gap-1.5">
                <i data-lucide="building-2" class="w-4 h-4"></i> Informasi Unit Kerja
              </div>
              <p><strong>Pimpinan:</strong> <span x-text="activeBranchData.leader"></span></p>
              <p><strong>Jam Kerja HO:</strong> <span x-text="activeBranchData.workHours"></span></p>
              <p><strong>Absensi:</strong> <span x-text="activeBranchData.absentMethod"></span></p>
              <p><strong>Cakupan Dokumen:</strong> <span x-text="activeBranchRules.length + ' Bab (' + activeBranchData.totalPasal + ')'"></span></p>
            </div>

            <div class="bg-white/95 backdrop-blur-sm rounded-xl shadow-sm border border-slate-200 p-2 space-y-1">
              <template x-if="currentUser.role !== 'admin'">
                <div class="space-y-1">
                  <button @click="activeTab = 'bacapp'; selectedBab = null;" :class="activeTab === 'bacapp' ? (currentUser.branch === 'PT_MKK' ? 'bg-blue-50 text-blue-700 font-semibold' : 'bg-rose-50 text-rose-700 font-semibold') : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-left transition">
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                    <span x-text="currentUser.branch === 'PT_MKK' ? 'Baca Peraturan (Bab I - XIV)' : 'Baca Peraturan (Bab I - XIII)'"></span>
                  </button>
                  <button @click="activeTab = 'sanksi'" :class="activeTab === 'sanksi' ? (currentUser.branch === 'PT_MKK' ? 'bg-blue-50 text-blue-700 font-semibold' : 'bg-rose-50 text-rose-700 font-semibold') : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-left transition">
                    <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                    <span x-text="currentUser.branch === 'PT_MKK' ? 'Daftar Sanksi & Pasal 41' : 'Daftar Sanksi & Pasal 34'"></span>
                  </button>
                  <button @click="activeTab = 'kepatuhan'; $nextTick(() => initCanvas())" :class="activeTab === 'kepatuhan' ? (currentUser.branch === 'PT_MKK' ? 'bg-blue-50 text-blue-700 font-semibold' : 'bg-rose-50 text-rose-700 font-semibold') : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-left transition">
                    <i data-lucide="file-signature" class="w-4 h-4"></i>
                    <span>Pernyataan Kepatuhan</span>
                  </button>
                </div>
              </template>

              <template x-if="currentUser.role === 'admin'">
                <div class="space-y-1">
                  <button @click="activeTab = 'admin_dashboard'" :class="activeTab === 'admin_dashboard' ? 'bg-emerald-50 text-emerald-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-left transition">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span>Log Kepatuhan Karyawan</span>
                  </button>
                  <button @click="activeTab = 'admin_notif'" :class="activeTab === 'admin_notif' ? 'bg-emerald-50 text-emerald-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-left transition">
                    <i data-lucide="megaphone" class="w-4 h-4"></i>
                    <span>Kirim Notifikasi & Update Pasal</span>
                  </button>
                  <button @click="activeTab = 'admin_settings'" :class="activeTab === 'admin_settings' ? 'bg-emerald-50 text-emerald-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-left transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span>Pengaturan Logo / Animasi GIF</span>
                  </button>
                </div>
              </template>
            </div>
          </aside>

          <!-- CONTENT AREA -->
          <section class="lg:col-span-3 space-y-6">

            <!-- BANNER NOTIFIKASI UPDATE TERBARU (OTOMATIS MUNCUL JIKA ADA UPDATE) -->
            <template x-if="currentUser.role !== 'admin' && latestNotification">
              <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl shadow-sm flex items-start justify-between gap-4 animate-fade-in">
                <div class="flex items-start gap-3">
                  <div class="p-2 bg-amber-100 rounded-lg text-amber-700 mt-0.5">
                    <i data-lucide="bell-ring" class="w-5 h-5"></i>
                  </div>
                  <div class="space-y-1">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="text-[10px] font-bold uppercase tracking-wider bg-amber-200 text-amber-900 px-2 py-0.5 rounded">Update Peraturan Terbaru</span>
                      <span class="text-xs text-slate-500" x-text="latestNotification.date"></span>
                    </div>
                    <h3 class="text-sm font-bold text-slate-900" x-text="latestNotification.title"></h3>
                    <p class="text-xs text-slate-700 leading-relaxed" x-text="latestNotification.message"></p>
                  </div>
                </div>
                <button @click="dismissBanner()" class="text-slate-400 hover:text-slate-600 p-1">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
            </template>

            <!-- BANNER SAPAAN -->
            <template x-if="currentUser.role !== 'admin'">
              <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-6 rounded-2xl shadow-lg flex flex-col sm:flex-row items-center justify-between gap-4 animate-fade-in">
                <div class="space-y-1 text-center sm:text-left">
                  <span class="text-xs uppercase tracking-wider bg-emerald-800/60 px-3 py-1 rounded-full font-medium">Portal Karyawan Aktif • Edisi Juni 2026</span>
                  <h2 class="text-2xl font-bold pt-1" x-text="greetingText + ', ' + currentUser.name + '!'"></h2>
                  <p class="text-xs text-emerald-100 opacity-90">Selamat datang di Portal Peraturan Perusahaan <span x-text="activeBranchData.name"></span>. Silakan baca seluruh Bab & isi pernyataan kepatuhan Anda.</p>
                </div>
                <div class="p-3 bg-white/10 rounded-2xl backdrop-blur-sm hidden sm:flex items-center justify-center">
                  <i data-lucide="book-check" class="w-10 h-10 text-emerald-200"></i>
                </div>
              </div>
            </template>

            <!-- TAB 1: BACA PERATURAN LENGKAP -->
            <div x-show="activeTab === 'bacapp' && currentUser.role !== 'admin'" class="space-y-4">
              <template x-if="!selectedBab">
                <div class="space-y-4">
                  <div class="bg-white/95 backdrop-blur-sm p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div class="flex items-center gap-4">
                      <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-slate-50 border overflow-hidden p-1">
                        <img :src="activeBranchData.logo" alt="Logo" class="w-full h-full object-contain">
                      </div>
                      <div>
                        <h2 class="text-xl font-bold text-slate-900" x-text="activeBranchData.name"></h2>
                        <p class="text-sm text-slate-500">Klik Bab di bawah ini untuk membaca seluruh Pasal dan Ayat secara lengkap</p>
                      </div>
                    </div>
                    <span class="text-xs font-semibold px-3 py-1 rounded-full shadow-sm"
                          :class="currentUser.branch === 'PT_MKK' ? 'bg-blue-100 text-blue-800' : 'bg-rose-100 text-rose-800'" 
                          x-text="activeBranchData.shortName"></span>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="(bab, index) in filteredRules" :key="bab.id">
                      <div @click="selectedBab = bab; $nextTick(() => lucide.createIcons())" 
                           class="bg-white/95 backdrop-blur-sm p-5 rounded-xl shadow-sm border border-slate-200 hover:border-emerald-500 hover:shadow-md transition cursor-pointer flex flex-col justify-between space-y-3 group">
                        <div class="flex items-start justify-between">
                          <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 group-hover:bg-emerald-100 group-hover:text-emerald-800 transition" x-text="bab.babLabel"></span>
                          <span class="text-[11px] font-medium text-slate-400" x-text="bab.pasalRange"></span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-base group-hover:text-emerald-700 transition" x-text="bab.title"></h3>
                        <p class="text-xs text-slate-500 line-clamp-2" x-text="bab.summary"></p>
                        <div class="pt-1 flex items-center text-xs font-semibold text-emerald-600">
                          <span>Baca Selengkapnya</span>
                          <i data-lucide="arrow-right" class="w-4 h-4 ml-1 transition-transform group-hover:translate-x-1"></i>
                        </div>
                      </div>
                    </template>
                  </div>

                  <div x-show="filteredRules.length === 0" class="bg-white/95 p-8 rounded-xl text-center space-y-2 border border-slate-200">
                    <p class="text-sm font-bold text-slate-700">Tidak ditemukan Bab atau Pasal dengan kata kunci "<span x-text="searchQuery"></span>"</p>
                    <button @click="searchQuery = ''" class="text-xs text-emerald-600 font-semibold underline">Reset Pencarian</button>
                  </div>
                </div>
              </template>

              <!-- DETAIL ISI BAB -->
              <template x-if="selectedBab">
                <div class="bg-white/95 backdrop-blur-sm p-6 sm:p-8 rounded-xl shadow-sm border border-slate-200 space-y-6 animate-fade-in">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <button @click="selectedBab = null; $nextTick(() => lucide.createIcons())" class="inline-flex items-center gap-2 text-xs font-semibold text-emerald-700 hover:text-emerald-800 bg-emerald-50 hover:bg-emerald-100 px-3 py-2 rounded-lg transition">
                      <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Daftar Bab
                    </button>
                    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600" x-text="selectedBab.pasalRange"></span>
                  </div>

                  <div class="border-b pb-4 space-y-1">
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-600" x-text="selectedBab.babLabel"></span>
                    <h2 class="text-2xl font-bold text-slate-900" x-text="selectedBab.title"></h2>
                    <p class="text-xs text-slate-500" x-text="activeBranchData.name + ' • Ditetapkan di Jakarta, 8 Juni 2026'"></p>
                  </div>

                  <div class="text-sm text-slate-700 leading-relaxed space-y-6" x-html="selectedBab.content"></div>

                  <div class="pt-6 border-t flex justify-between items-center">
                    <button @click="selectedBab = null; window.scrollTo({top: 0, behavior: 'smooth'}); $nextTick(() => lucide.createIcons())" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-lg transition flex items-center gap-1.5">
                      <i data-lucide="arrow-left" class="w-4 h-4"></i> Tutup & Pilih Bab Lain
                    </button>
                  </div>
                </div>
              </template>
            </div>

            <!-- TAB 2: DAFTAR SANKSI & PASAL LENGKAP -->
            <div x-show="activeTab === 'sanksi' && currentUser.role !== 'admin'" class="bg-white/95 backdrop-blur-sm p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
              <div>
                <span class="text-xs font-bold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-md uppercase tracking-wider"
                      x-text="currentUser.branch === 'PT_MKK' ? 'Pasal 41 Resmi (PT MKK)' : 'Pasal 34 & Pasal 47 Resmi (CV MGM)'"></span>
                <h2 class="text-xl font-bold text-slate-900 pt-1">Jenis Pelanggaran dan Sanksi</h2>
                <p class="text-sm text-slate-500">Rincian lengkap Kategori Berat (Poin 1-43), Sedang (Poin 1-25), dan Ringan (Poin 1-18)</p>
              </div>

              <div class="flex flex-wrap gap-2 border-b pb-3">
                <button @click="sanksiTab = 'ringkasan'" :class="sanksiTab === 'ringkasan' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Ringkasan Sanksi</button>

        // COMPUTED PROPERTIES
        get activeBranchRules() {
          if (!this.currentUser || this.currentUser.role === 'admin') return this.rulesByBranch.PT_MKK;
          return this.rulesByBranch[this.currentUser.branch] || [];
        },
        get filteredRules() {
          const list = this.activeBranchRules;
          if (!this.searchQuery) return list;
          const q = this.searchQuery.toLowerCase();
          return list.filter(r =>
            r.babLabel.toLowerCase().includes(q) ||
            r.pasalRange.toLowerCase().includes(q) ||
            r.title.toLowerCase().includes(q) ||
            r.summary.toLowerCase().includes(q) ||
            r.content.toLowerCase().includes(q)
          );
        },
        get branchNotifications() {
          if (!this.currentUser || this.currentUser.role === 'admin') return this.notifications;
          return this.notifications.filter(n => n.targetBranch === 'ALL' || n.targetBranch === this.currentUser.branch);
        },
        get unreadNotificationsCount() {
          if (!this.currentUser) return 0;
          const readIds = JSON.parse(localStorage.getItem('pp_read_notifs_' + this.currentUser.nik) || '[]');
          return this.branchNotifications.filter(n => !readIds.includes(n.id)).length;
        },
        get latestNotification() {
          if (this.bannerDismissed || this.branchNotifications.length === 0) return null;
          return this.branchNotifications[0];
        },

        // METHODS
        initApp() {
          const savedNotifs = localStorage.getItem('pp_notifications');
          if (savedNotifs) this.notifications = JSON.parse(savedNotifs);

          const savedEmps = localStorage.getItem('pp_employees');
          if (savedEmps) this.employeesList = JSON.parse(savedEmps);

          const savedLoginLogo = localStorage.getItem('pp_login_logo');
          if (savedLoginLogo) this.loginLogo = savedLoginLogo;

          const savedMkkLogo = localStorage.getItem('pp_logo_PT_MKK');
          if (savedMkkLogo) this.branches.PT_MKK.logo = savedMkkLogo;

          const savedMgmLogo = localStorage.getItem('pp_logo_CV_MGM');
          if (savedMgmLogo) this.branches.CV_MGM.logo = savedMgmLogo;

          this.$nextTick(() => lucide.createIcons());
        },
        handleLogin() {
          this.currentUser = {
            role: 'employee',
            branch: this.loginForm.branch,
            name: this.loginForm.name.trim(),
            nik: this.loginForm.nik.trim().toUpperCase(),
            position: this.loginForm.position.trim()
          };
          this.activeBranchData = this.branches[this.currentUser.branch];
          this.isLoggedIn = true;
          this.activeTab = 'bacapp';
          this.selectedBab = null;
          this.bannerDismissed = false;

          const hour = new Date().getHours();
          if (hour < 11) this.greetingText = 'Selamat Pagi';
          else if (hour < 15) this.greetingText = 'Selamat Siang';
          else if (hour < 18) this.greetingText = 'Selamat Sore';
          else this.greetingText = 'Selamat Malam';

          if (!this.employeesList.some(e => e.nik === this.currentUser.nik)) {
            this.employeesList.push({ ...this.currentUser, signed: false, signedAt: '-' });
            localStorage.setItem('pp_employees', JSON.stringify(this.employeesList));
          }
          this.$nextTick(() => { lucide.createIcons(); this.initCanvas(); });
        },
        promptAdminLogin() {
          const pin = prompt("Masukkan Kode PIN / Password Administrator:");
          if (pin === "admin123") {
            this.currentUser = { role: 'admin', name: 'HR Administrator', nik: 'ADM-01', position: 'HR Manager' };
            this.isLoggedIn = true;
            this.activeTab = 'admin_dashboard';
            this.$nextTick(() => { lucide.createIcons(); });
          } else if (pin !== null) {
            alert("PIN Admin Salah!");
          }
        },
        publishNotification() {
          const today = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
          this.notifications.unshift({
            id: Date.now(),
            targetBranch: this.notifForm.targetBranch,
            title: this.notifForm.title,
            message: this.notifForm.message,
            date: today
          });
          localStorage.setItem('pp_notifications', JSON.stringify(this.notifications));
          this.notifForm.title = '';
          this.notifForm.message = '';
          alert('Notifikasi pembaruan peraturan berhasil dipublikasikan ke karyawan!');
        },
        deleteNotification(id) {
          this.notifications = this.notifications.filter(n => n.id !== id);
          localStorage.setItem('pp_notifications', JSON.stringify(this.notifications));
        },
        markNotificationsRead() {
          if (!this.currentUser) return;
          const allIds = this.branchNotifications.map(n => n.id);
          localStorage.setItem('pp_read_notifs_' + this.currentUser.nik, JSON.stringify(allIds));
        },
        dismissBanner() {
          this.bannerDismissed = true;
          this.markNotificationsRead();
        },
        uploadLoginLogo(event) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              this.loginLogo = e.target.result;
              localStorage.setItem('pp_login_logo', e.target.result);
              alert("Logo Login diperbarui!");
            };
            reader.readAsDataURL(file);
          }
        },
        uploadLogo(event, branchKey) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              this.branches[branchKey].logo = e.target.result;
              localStorage.setItem('pp_logo_' + branchKey, e.target.result);
              alert("Logo unit diperbarui!");
            };
            reader.readAsDataURL(file);
          }
        },
        logout() {
          this.isLoggedIn = false;
          this.currentUser = null;
          this.selectedBab = null;
          this.searchQuery = '';
          this.submitted = false;
        },
        initCanvas() {
          const canvas = document.getElementById('signature-canvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          let writing = false;
          const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
          };

          const startDraw = (e) => { e.preventDefault(); writing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
          const draw = (e) => { if (!writing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
          const stopDraw = (e) => { if (!writing) return; writing = false; ctx.closePath(); };

          canvas.onmousedown = startDraw;
          canvas.onmousemove = draw;
          canvas.onmouseup = stopDraw;
          canvas.onmouseleave = stopDraw;
          canvas.ontouchstart = startDraw;
          canvas.ontouchmove = draw;
          canvas.ontouchend = stopDraw;
        },
        clearSignature() {
          const canvas = document.getElementById('signature-canvas');
          if (canvas) { canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height); }
        },
        submitSignature() {
          this.submitted = true;
          const now = new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
          const emp = this.employeesList.find(e => e.nik === this.currentUser.nik);
          if (emp) {
            emp.signed = true;
            emp.signedAt = now;
            localStorage.setItem('pp_employees', JSON.stringify(this.employeesList));
          }
        }
      };
    }
  </script>
